<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabBlackBox</title>
    <style>
      :root { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
      :root[data-color-mode="dark"] { color: #f0f6fc; background: #0d1117; }
      body { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
      h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
      p { margin: 8px 0; overflow-wrap: anywhere; }
      a { color: #0969da; }
      .muted { color: #59636e; }
      :root[data-color-mode="dark"] a { color: #4493f8; }
      :root[data-color-mode="dark"] .muted { color: #9198a1; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="address" class="muted"></p>
      <p id="message"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
