name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the tests on Windows
        type: boolean
        default: false
      macos:
        description: Also run the tests on MacOS
        type: boolean
        default: false
      mutation:
        description: Also run mutation testing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.platform == 'windows' && 'Windows' || matrix.platform == 'macos' && 'MacOS' || 'Ubuntu' }} / Node 24 / Chromium
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Ubuntu always, Windows and MacOS only when explicitly enabled
      matrix:
        platform: ${{ fromJSON(format('["ubuntu"{0}{1}]', inputs.windows && ',"windows"' || '', inputs.macos && ',"macos"' || '')) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the update test builds an older commit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # download Playwright Chromium into .test-browsers
      - name: Install test browser
        run: npm run test:install-browser

      - name: Install Chromium system libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      # source maps for browser coverage
      - name: Build extension
        run: npm run build
        env:
          TABBLACKBOX_COVERAGE: '1'

      # reuse the old build until the baseline commit changes
      - name: Restore baseline build
        uses: actions/cache@v4
        with:
          path: .baseline
          key: baseline-${{ runner.os }}-${{ hashFiles('scripts/build-baseline.mjs') }}

      - name: Build baseline extension
        run: npm run test:baseline

      - name: Check types
        run: npm run typecheck

      # unit, integration, package tests with coverage
      - name: Run Vitest tests
        run: npx vitest run --coverage

      # ui and e2e tests in headless Chromium with page coverage
      - name: Run Playwright tests
        run: npx playwright test
        env:
          TABBLACKBOX_COVERAGE: '1'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # optional mutation testing
  mutation:
    name: Mutation testing
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation -- --concurrency 4

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
